name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Load release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="releases/${TAG}.md"
          if [ -f "$FILE" ]; then
            # Use delimiter to handle multiline
            echo "RELEASE_NOTES<<ENDOFNOTES" >> "$GITHUB_ENV"
            cat "$FILE" >> "$GITHUB_ENV"
            echo "ENDOFNOTES" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NOTES=" >> "$GITHUB_ENV"
          fi
      - name: Validate formula generation
        # Gate before anything publishes: render against a synthetic
        # checksums file, check Ruby syntax, and pin the 4-platform shape.
        run: |
          FAKE_SHA=$(printf 'a%.0s' $(seq 64))
          mkdir -p /tmp/formula-check
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            echo "${FAKE_SHA}  a9s_0.0.0-check_${platform}.tar.gz" >> /tmp/formula-check/checksums.txt
          done
          scripts/generate-homebrew-formula.sh 0.0.0-check /tmp/formula-check/checksums.txt > /tmp/formula-check/a9s.rb
          ruby -c /tmp/formula-check/a9s.rb
          test "$(grep -c 'sha256 ' /tmp/formula-check/a9s.rb)" = 4
          test "$(grep -c 'releases/download/v0.0.0-check/' /tmp/formula-check/a9s.rb)" = 4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/generate-homebrew-formula.sh "$VERSION" dist/checksums.txt > /tmp/a9s.rb
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/k2m30/homebrew-a9s.git" /tmp/homebrew-a9s
          mkdir -p /tmp/homebrew-a9s/Formula
          cp /tmp/a9s.rb /tmp/homebrew-a9s/Formula/a9s.rb
          cd /tmp/homebrew-a9s
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/a9s.rb
          git diff --cached --quiet || git commit -m "Brew formula update for a9s version v${VERSION}"
          git push

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o build/linux-amd64/a9s ./cmd/a9s/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o build/linux-arm64/a9s ./cmd/a9s/
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - name: Extract semver components
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG%.*}"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/k2m30/a9s:${{ github.ref_name }}
            ghcr.io/k2m30/a9s:${{ steps.semver.outputs.minor }}
            ghcr.io/k2m30/a9s:${{ steps.semver.outputs.major }}
            ghcr.io/k2m30/a9s:latest
